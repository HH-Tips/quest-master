<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestMaster Game</title>
    <!-- Font Retro e Monospace caricati da Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --terminal-bg: #181818;
            --accent-blue: #0082fc;
            --accent-orange: #ff9f1c;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --success-color: #00ff66;
            --failure-color: #ff3333;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Barra di sistema superiore */
        #system-top-bar {
            background-color: #1a1a1a;
            border-bottom: 1px solid #2d2d2d;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            user-select: none;
            flex-shrink: 0;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .system-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-orange);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-orange);
        }

        .top-bar-center {
            font-weight: bold;
            color: var(--text-main);
        }

        /* Contenitore Principale Gioco - Ora flessibile per la centratura totale */
        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 1.5rem;
            box-sizing: border-box;
            width: 100%;
            overflow: hidden;
        }

        /* Terminale principale */
        #main-game-wrapper {
            position: relative;
            background-color: var(--terminal-bg);
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 130, 252, 0.15);
            padding: 2.5rem;
            width: 100%;
            max-width: 800px;
            min-height: 450px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Effetto Scanline retro */
        #main-game-wrapper::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            z-index: 2;
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.4;
        }

        /* Logo e Intestazione */
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1#game-title {
            font-family: 'Press Start 2P', monospace;
            color: var(--accent-orange);
            font-size: 2rem;
            margin: 0;
            text-shadow: 3px 3px 0px #9b5a00;
            letter-spacing: -1px;
            word-wrap: break-word;
        }

        /* Box di Descrizione Terminale */
        #description-box {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            min-height: 120px;
            border: 2px dashed var(--accent-blue);
            padding: 1.5rem;
            background-color: rgba(0, 130, 252, 0.03);
            color: var(--text-main);
            box-sizing: border-box;
        }

        /* Lista Scelte */
        #choices-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        button, .restart-btn {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 1.2rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            border-radius: 0;
            box-shadow: 4px 4px 0px #0051a3;
            position: relative;
        }

        button:hover, .restart-btn:hover {
            background-color: var(--accent-orange);
            color: #121212;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #9b5a00;
        }

        button:active, .restart-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #9b5a00;
        }

        /* Card degli Obiettivi di Gioco agganciata in alto a sinistra */
        #objective-card {
            background-color: var(--terminal-bg);
            padding: 1.5rem;
            border: 2px dashed var(--accent-orange);
            box-shadow: 4px 4px 0px rgba(255, 159, 28, 0.1);
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        #objective-card h3 {
            margin-top: 0;
            color: var(--accent-orange);
            font-size: 1.2rem;
            border-bottom: 2px solid var(--accent-orange);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        #objective-content {
            overflow-y: auto;
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Media queries per posizionamento assoluto su Desktop e adattamento su Mobile */
        @media (min-width: 1024px) {
            #objective-card {
                position: fixed;
                left: 20px;
                top: 55px; /* 35px di top-bar + 20px di margine */
                width: 320px;
                max-height: calc(100vh - 110px); /* Evita di coprire le barre */
                z-index: 100;
            }
            #main-game-wrapper {
                max-width: 800px;
            }
        }

        @media (max-width: 1023px) {
            body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }
            #game-container {
                flex-direction: column;
                justify-content: start;
                align-items: stretch;
                overflow: visible;
                padding-bottom: 50px; /* Spazio per la barra inferiore fissa */
            }
            #objective-card {
                position: static;
                width: 100%;
                margin-bottom: 1.5rem;
                max-height: none;
            }
            #main-game-wrapper {
                width: 100%;
                min-height: auto;
            }
            #system-bottom-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 200;
            }
        }

        /* Scrollbar personalizzata nello stile del terminale */
        #objective-content::-webkit-scrollbar,
        #game-container::-webkit-scrollbar {
            width: 6px;
        }
        #objective-content::-webkit-scrollbar-thumb,
        #game-container::-webkit-scrollbar-thumb {
            background-color: var(--accent-blue);
        }
        #objective-content::-webkit-scrollbar-track,
        #game-container::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Schermate di fine partita */
        .status-screen {
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        .status-screen h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .victory {
            color: var(--success-color);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        .defeat {
            color: var(--failure-color);
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
        }

        .restart-btn {
            display: inline-block;
            margin-top: 2rem;
            width: auto;
            padding: 1.2rem 2.5rem;
        }

        /* Barra di sistema inferiore */
        #system-bottom-bar {
            background-color: #1a1a1a;
            border-top: 1px solid #2d2d2d;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            user-select: none;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .bottom-bar-left {
            color: var(--text-muted);
        }

        .bottom-bar-right {
            color: var(--accent-orange);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            letter-spacing: 1px;
            font-weight: bold;
        }

        #move-count-val {
            color: var(--success-color);
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<!-- Barra Superiore di Sistema -->
<div id="system-top-bar">
    <div class="top-bar-left">
        <span class="system-dot"></span>
    </div>
    <div class="top-bar-center">QuestMasterApp</div>
    <div class="top-bar-right" id="terminal-clock">--:--:--</div>
</div>

<div id="game-container">
    <!-- Card dell'Obiettivo, ora agganciata in alto a sinistra su desktop tramite CSS -->
    <div id="objective-card">
        <h3>Obiettivo Missione</h3>
        <div id="objective-content">
            <p id="mission-objective">Definisci l'obiettivo nel JSON...</p>
        </div>
    </div>

    <!-- Finestra Terminale Principale, ora centrata sulla pagina -->
    <div id="main-game-wrapper">
        <div id="main-game">
            <div class="logo-container">
                <h1 id="game-title">Caricamento...</h1>
            </div>

            <div id="description-box"></div>
            <div id="choices-container"></div>
        </div>

        <div id="status-screen" class="status-screen">
            <h2 id="status-title">In corso</h2>
            <p id="status-message"></p>
            <button class="restart-btn" onclick="resetGame()">Riprova l'avventura</button>
        </div>
    </div>
</div>

<!-- Barra Inferiore di Sistema con contatore mosse e senza elementi superflui -->
<div id="system-bottom-bar">
    <div class="bottom-bar-left">
        <!-- Elementi superflui rimossi per pulizia -->
    </div>
    <div class="bottom-bar-right">
        MOSSE: <span id="move-count-val">0</span>
    </div>
</div>

<script>
    const jsonData = {"title": "Spider-Man: La Trappola di Mysterio negli Studios", "objective": "Infiltrati negli studios cinematografici, recupera la tessera magnetica e il dispositivo EMP, neutralizza le illusioni di Mysterio, spegni il generatore di gas e sconfiggi l'antagonista.", "initialState": "ingresso-studios", "states": {"ingresso-studios": {"description": "Sei all'ingresso degli studios cinematografici abbandonati. La porta blindata verso la sala di regia \u00e8 bloccata elettronicamente. Da qui puoi accedere alla galleria dei riflettori o al capannone delle scenografie.", "choices": [{"text": "Raggiungi il capannone delle scenografie", "next": "capannone-scenografie_early"}, {"text": "Vai nella galleria dei riflettori", "next": "galleria-riflettori"}, {"text": "Tenta di forzare subito la porta blindata della sala regia", "next": "caught_door_fail"}]}, "caught_door_fail": {"description": "Hai provato a forzare la porta bloccata senza la tessera. Un sistema di difesa elettrico si attiva e ti scarica addosso migliaia di volt.", "type": "defeat", "message": "SCONFITTO: La scossa elettrica ti ha neutralizzato."}, "capannone-scenografie_early": {"description": "Sei nel capannone delle scenografie. Un drone proiettore sbarra il passaggio verso il laboratorio effetti speciali. Ti rende impassabile l'area, ma non hai ancora esplorato il resto dell'edificio.", "choices": [{"text": "Ritorna all'ingresso degli studios", "next": "ingresso-studios"}, {"text": "Neutralizza il drone proiettore con i tuoi spararagnatele", "next": "laboratorio_no_card"}]}, "laboratorio_no_card": {"description": "Distruggi il drone ed entri nel laboratorio. Trovi il dispositivo EMP tascabile, ma ti accorgi di non avere ancora la tessera magnetica per la sala di regia.", "choices": [{"text": "Rimani a cercare la tessera dentro al laboratorio", "next": "gas_timeout"}, {"text": "Prendi il dispositivo EMP e torna all'ingresso", "next": "ingresso_with_emp"}]}, "ingresso_with_emp": {"description": "Sei tornato all'ingresso con il dispositivo EMP, ma la porta per la sala regia \u00e8 ancora bloccata elettronicamente.", "choices": [{"text": "Tenta di spaccare la porta con un pugno", "next": "caught_door_fail"}, {"text": "Vai nella galleria dei riflettori per cercare la tessera", "next": "galleria_from_emp"}]}, "galleria_from_emp": {"description": "Sei nella galleria dei riflettori. Tra i fari da scena trovi la tessera magnetica d'accesso.", "choices": [{"text": "Toccca i riflettori cinematografici per controllare la zona", "next": "trap_light"}, {"text": "Raccogli la tessera magnetica e torna all'ingresso", "next": "ingresso_ready"}]}, "galleria-riflettori": {"description": "Sei nella galleria dei riflettori. Sotto un riflettore scorgi una tessera magnetica d'accesso appoggiata su un tavolo da lavoro.", "choices": [{"text": "Ispeziona i riflettori prima di raccogliere l'oggetto", "next": "trap_light"}, {"text": "Prendi la tessera magnetica e torna all'ingresso", "next": "ingresso_with_key"}, {"text": "Prendi la tessera magnetica e vai al capannone delle scenografie", "next": "capannone-scenografie"}]}, "trap_light": {"description": "I riflettori erano trappole esplosive preparate da Mysterio. Un bagliore improvviso devasta la stanza.", "type": "defeat", "message": "SCONFITTO: Sei caduto in una trappola esplosiva."}, "ingresso_with_key": {"description": "Sei di nuovo all'ingresso con la tessera magnetica. La porta per la sala di regia pu\u00f2 essere aperta, ma non hai ancora il dispositivo EMP per la barriera di Mysterio.", "choices": [{"text": "Usa la tessera magnetica ed entra subito nella sala di regia", "next": "sala_regia_barrier_death"}, {"text": "Dirigiti al capannone delle scenografie", "next": "capannone-scenografie"}]}, "sala_regia_barrier_death": {"description": "Entri nella sala di regia, ma il campo di forza olografico di Mysterio \u00e8 ancora attivo. Non possedendo l'EMP, vieni spinto via e sopraffatto dai fumi del gas.", "type": "defeat", "message": "SCONFITTO: Senza EMP non puoi superare la barriera energetica."}, "capannone-scenografie": {"description": "Raggiungi il capannone delle scenografie. Un drone proiettore pattuglia la zona e sbarra il varco per il laboratorio effetti speciali.", "choices": [{"text": "Neutralizza il drone proiettore usando i tuoi spararagnatele", "next": "laboratorio-effetti-speciali"}, {"text": "Cerca di strisciare oltre il drone senza attaccarlo", "next": "drone_caught"}]}, "drone_caught": {"description": "Il drone proiettore ti individua immediatamente e proietta un'illusione accecante che ti disorienta, permettendo a Mysterio di catturarti.", "type": "defeat", "message": "SCONFITTO: Il drone ti ha scoperto."}, "laboratorio-effetti-speciali": {"description": "Sei all'interno del laboratorio effetti speciali. Su uno dei banchi da lavoro trova posto il dispositivo EMP tascabile.", "choices": [{"text": "Perdi tempo a esaminare le protesi di scena nel laboratorio", "next": "gas_timeout"}, {"text": "Raccogli il dispositivo EMP e torna di corsa all'ingresso degli studios", "next": "ingresso_ready"}]}, "gas_timeout": {"description": "Hai esitato troppo a lungo. Il generatore entra a pieno regime e diffonde il gas tossico in tutto il complesso.", "type": "defeat", "message": "SCONFITTO: Il gas tossico ti ha fatto perdere i sensi."}, "ingresso_ready": {"description": "Sei ritornato all'ingresso degli studios. Ora possiedi sia la tessera magnetica sia il dispositivo EMP tascabile.", "choices": [{"text": "Esiti e decidi di tornare verso la galleria", "next": "gas_timeout"}, {"text": "Usa la tessera magnetica per sbloccare la porta ed entra nella sala regia", "next": "sala-regia"}]}, "sala-regia": {"description": "Entri nella sala di regia! Mysterio ti attende protetto da una barriera olografica difensiva, mentre il generatore di gas allucinogeno \u00e8 in funzione.", "choices": [{"text": "Tenta di correre subito al generatore di gas ignorando Mysterio", "next": "barrier_shield_fail"}, {"text": "Lancia una ragnatela diretta contro la barriera energetica", "next": "barrier_reflect"}, {"text": "Usa il dispositivo EMP per sovraccaricare e disattivare la barriera", "next": "mysterio_exposed"}]}, "barrier_reflect": {"description": "La ragnatela viene incenerita dalla barriera energetica, che rimbalza la scarica direttamente contro di te.", "type": "defeat", "message": "SCONFITTO: La barriera olografica ha respinto il tuo attacco."}, "barrier_shield_fail": {"description": "Non puoi avvicinarti al generatore: il campo di forza eretto da Mysterio ti sbarra completamente la strada.", "type": "defeat", "message": "SCONFITTO: Impossibile disattivare il generatore con la barriera attiva."}, "mysterio_exposed": {"description": "L'EMP manda in corto circuito la barriera olografica! Mysterio resta scoperto, ma cerca di riattivare le illusioni visive del suo casco.", "choices": [{"text": "Attacca Mysterio con un pugno frontale senza prima accecare il casco", "next": "helmet_counter"}, {"text": "Usa le ragnatele per accecare il casco di Mysterio, mettilo KO e spegni il generatore", "next": "victory"}]}, "helmet_counter": {"description": "I sensori ottici del casco di Mysterio rilevano il tuo colpo e attivano una scossa contrenipote che ti stordisce.", "type": "defeat", "message": "SCONFITTO: I sensori del casco ti hanno sorpreso."}, "victory": {"description": "Accecato dalle ragnatele, Mysterio non riesce a schivare il tuo colpo decisivo e cade sconfitto. Subito dopo spegni il generatore di gas, salvando New York dalla catastrofe!", "type": "victory", "message": "VITTORIA: Hai sconfitto Mysterio e disattivato il generatore di gas!"}}};
    let movesCount = 0;

    function initGame() {
        movesCount = 0;
        updateMoveCounter();
        document.getElementById('game-title').innerText = jsonData.title;
        document.getElementById('mission-objective').innerText = jsonData.objective || "Nessun obiettivo specificato.";
        renderState(jsonData.initialState);
        startClock();
    }

    function renderState(stateKey) {
        const state = jsonData.states[stateKey];
        const mainGame = document.getElementById('main-game');
        const statusScreen = document.getElementById('status-screen');

        if (state.type === 'victory' || state.type === 'defeat') {
            mainGame.style.display = 'none';
            statusScreen.style.display = 'block';

            const titleEl = document.getElementById('status-title');
            titleEl.innerText = state.type === 'victory' ? "CONGRATULAZIONI!" : "GAME OVER";
            titleEl.className = state.type;

            document.getElementById('status-message').innerText = state.description + "\n\n" + state.message;
            return;
        }

        mainGame.style.display = 'block';
        statusScreen.style.display = 'none';

        document.getElementById('description-box').innerText = state.description;

        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = "";

        state.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.innerText = choice.text;
            btn.onclick = () => {
                movesCount++;
                updateMoveCounter();
                renderState(choice.next);
            };
            choicesContainer.appendChild(btn);
        });
    }

    function updateMoveCounter() {
        const counterEl = document.getElementById('move-count-val');
        if (counterEl) {
            counterEl.innerText = movesCount;
        }
    }

    function resetGame() {
        movesCount = 0;
        updateMoveCounter();
        renderState(jsonData.initialState);
    }

    // Gestione dell'orologio interattivo in tempo reale nella barra superiore
    function startClock() {
        const clockEl = document.getElementById('terminal-clock');
        if (clockEl) {
            const update = () => {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                clockEl.innerText = `${hh}:${mm}:${ss}`;
            };
            update();
            setInterval(update, 1000);
        }
    }

    window.onload = initGame;
</script>

</body>
</html>
